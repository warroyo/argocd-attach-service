apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: argoclusters.field.vmware.com
spec:
  group: field.vmware.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                clusterName:
                  type: string
                argoNamespace:
                  type: string
                project:
                  type: string
                  description: the argo project to attach to
                clusterLabels:
                  type: object
                  description: map of keys/values that are added to the labels in argocd for the cluster
                  additionalProperties:
                    type: string
              required:
                - clusterName
                - argoNamespace
                - project
            status: 
              type: object
              description: Current status of the Argonamespace.
              properties:
                state:
                  type: string
                message:
                  type: string
                ready:
                  type: boolean
                lastUpdated:
                  type: string
                  format: date-time
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: argoclusters
    singular: argocluster
    kind: ArgoCluster
    shortNames:
      - argcl
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: argonamespaces.field.vmware.com
spec:
  group: field.vmware.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                argoNamespace:
                  type: string
                  description: the namespace that the ArgoCD instance is deployed into
                serviceAccount:
                  type: string
                  description: an existing service account to use for the namespace attachment
                project:
                  type: string
                  description: the argo project to attach to
                clusterLabels:
                  type: object
                  description: map of keys/values that are added to the labels in argocd for the cluster
                  additionalProperties:
                    type: string
              required:
                - argoNamespace
                - project
            status: 
              type: object
              description: Current status of the Argonamespace.
              properties:
                state:
                  type: string
                message:
                  type: string
                ready:
                  type: boolean
                lastUpdated:
                  type: string
                  format: date-time
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: argonamespaces
    singular: argonamespace
    kind: ArgoNamespace
    shortNames:
      - argns
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: argoattachauthorities.field.vmware.com
spec:
  group: field.vmware.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                namespace:
                  type: string
                  description: the namespace that is designated as an attach authority, RemoteNamespace resources are only honored in designated namespaces
                allowedTargets:
                  type: array
                  description: namespaces this authority is allowed to attach, exact names or shell glob patterns
                  items:
                    type: string
              required:
                - namespace
                - allowedTargets
          required:
            - spec
  scope: Cluster
  names:
    plural: argoattachauthorities
    singular: argoattachauthority
    kind: ArgoAttachAuthority
    shortNames:
      - aaa
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remotenamespaces.field.vmware.com
spec:
  group: field.vmware.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetNamespace:
                  type: string
                  description: the remote namespace to attach to the ArgoCD instance in this resource's namespace
                project:
                  type: string
                  description: the argo project to attach to
                clusterLabels:
                  type: object
                  description: map of keys/values that are added to the labels in argocd for the cluster
                  additionalProperties:
                    type: string
              required:
                - targetNamespace
                - project
            status:
              type: object
              description: Current status of the RemoteNamespace.
              properties:
                state:
                  type: string
                message:
                  type: string
                ready:
                  type: boolean
                lastUpdated:
                  type: string
                  format: date-time
                attachedNamespaceUID:
                  type: string
                  description: uid of the target namespace at provision time, used to detect namespace recreation and to gate cleanup
                serviceAccount:
                  type: string
                  description: name of the service account provisioned in the target namespace
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: remotenamespaces
    singular: remotenamespace
    kind: RemoteNamespace
    shortNames:
      - rmns